name: AlpineRide
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  AlpineRide:
    type: application
    platform: iOS
    sources:
      - path: AlpineRide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.alpineride.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AlpineRide/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - AlpineRideTests
  AlpineRideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AlpineRideTests
    dependencies:
      - target: AlpineRide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.alpineride.app.tests
        GENERATE_INFOPLIST_FILE: YES
